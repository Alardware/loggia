name: Validation

on:
  push:
  pull_request:
  schedule:
    # Une fois par semaine : hassfest et HACS evoluent, un depot qui passait
    # hier peut ne plus passer demain sans qu'on y ait touche.
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: hassfest (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  python:
    name: Composant Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Les tests posent leurs propres doublures de Home Assistant : inutile de
      # l'installer, et la suite ne se fige pas sur une version.
      - run: pip install pytest
      - run: python -m pytest tests/python -q

  frontend:
    name: Frontend (lint, tests, donnees personnelles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Refuse la publication si une entite, un prenom ou une adresse du
      # domicile a ete laisse en dur dans les sources.
      - run: npm run audit
