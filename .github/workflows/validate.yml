name: Validation

on:
  # Les branches seulement. Sans ce filtre, `push` se declenche AUSSI sur les
  # tags : chaque `git push` d'un tag relancait les quatre travaux sur un commit
  # valide quelques minutes plus tot, en pure perte. Le doublon du tag v2.5.5
  # n'a jamais demarre — quatre travaux restes en file d'attente, puis le run
  # marque en echec — et laissait une croix rouge dans l'historique sous un code
  # dont la validation, elle, etait verte.
  push:
    branches: ['**']
  pull_request:
  # Relance a la demande : les controles HACS interrogent GitHub au moment du
  # run — topics, description, marque. Corriger un reglage du depot ne suffit
  # donc pas, il faut refaire tourner la validation.
  workflow_dispatch:
  schedule:
    # Une fois par semaine : hassfest et HACS evoluent, un depot qui passait
    # hier peut ne plus passer demain sans qu'on y ait touche.
    - cron: "0 4 * * 1"

# Le moins de droits possible : ces travaux lisent le depot et ne publient
# rien. Sans ce bloc, chacun recevait les droits par defaut du jeton — l'alerte
# CodeQL « actions/missing-workflow-permissions », cinq fois (19/09/2026).
permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Branche flottante A DESSEIN, et la seule exception avec HACS ci-dessous.
      # Home Assistant publie ses controles de manifeste sur `master` et ne pose
      # pas de tag : epingler un SHA figerait la validation sur les regles d'un
      # jour donne, et le composant passerait une CI qui ne verifie plus ce que
      # la version courante exige. Tout le reste est epingle par SHA (24/09,
      # plan M15).
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Meme raison : HACS publie ses regles de validation sur `main`. Un SHA
      # fige ferait passer un depot que HACS refuserait a l'installation.
      - uses: hacs/action@main
        with:
          category: integration

  python:
    name: Composant Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Les tests posent leurs propres doublures de Home Assistant : inutile de
      # l'installer, et la suite ne se fige pas sur une version.
      - run: pip install pytest
      - run: python -m pytest tests/python -q

  paquet:
    name: Paquet embarque = build du commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: python scripts/pack_frontend.py
      # Le paquet du depot doit etre EXACTEMENT ce que produit le build de ce
      # commit — c'est lui que HACS livre. Jusqu'ici cette garde n'existait
      # que sur la machine de developpement (pack_frontend refuse un build
      # perime) ; un commit pousse avec frontend/ desynchronise partait tel
      # quel. `git add -N` rend visibles au diff les fichiers que le pack
      # aurait crees en plus.
      - run: |
          git add -N custom_components/loggia/frontend
          git diff --exit-code -- custom_components/loggia/frontend

  frontend:
    name: Frontend (lint, tests, donnees personnelles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 est deprecie, et surtout : il ne developpe pas les motifs
          # glob de `--test`. La suite est desormais lancee par decouverte
          # automatique, mais autant tourner sur une version soutenue.
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Refuse la publication si une entite, un prenom ou une adresse du
      # domicile a ete laisse en dur dans les sources.
      - run: npm run audit
