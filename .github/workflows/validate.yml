name: Validation

on:
  # Les branches seulement. Sans ce filtre, `push` se declenche AUSSI sur les
  # tags : chaque `git push` d'un tag relancait les quatre travaux sur un commit
  # valide quelques minutes plus tot, en pure perte. Le doublon du tag v2.5.5
  # n'a jamais demarre — quatre travaux restes en file d'attente, puis le run
  # marque en echec — et laissait une croix rouge dans l'historique sous un code
  # dont la validation, elle, etait verte.
  push:
    branches: ['**']
  pull_request:
  # Relance a la demande : les controles HACS interrogent GitHub au moment du
  # run — topics, description, marque. Corriger un reglage du depot ne suffit
  # donc pas, il faut refaire tourner la validation.
  workflow_dispatch:
  schedule:
    # Une fois par semaine : hassfest et HACS evoluent, un depot qui passait
    # hier peut ne plus passer demain sans qu'on y ait touche.
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: hassfest (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  python:
    name: Composant Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Les tests posent leurs propres doublures de Home Assistant : inutile de
      # l'installer, et la suite ne se fige pas sur une version.
      - run: pip install pytest
      - run: python -m pytest tests/python -q

  frontend:
    name: Frontend (lint, tests, donnees personnelles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 est deprecie, et surtout : il ne developpe pas les motifs
          # glob de `--test`. La suite est desormais lancee par decouverte
          # automatique, mais autant tourner sur une version soutenue.
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Refuse la publication si une entite, un prenom ou une adresse du
      # domicile a ete laisse en dur dans les sources.
      - run: npm run audit
