# La démo en ligne : la maison de démonstration, servie par GitHub Pages.
#
# Une construction à part (`npm run build:demo`, mode Vite « demo ») qui
# démarre toujours dans la démo : il n'y a pas de Home Assistant derrière,
# aucune adresse à saisir. Elle suit `main` — chaque changement du dashboard
# s'y voit — et ne touche jamais au paquet que HACS livre (`dist-demo/`,
# pas `dist/`).
name: Démo en ligne

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      # Les pages légales du site (ADR 0062) : une correction doit se publier
      # même si rien d'autre ne bouge.
      - 'site/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois ; celle qui a commencé va au bout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire la démo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-demo

  publier:
    name: Publier sur GitHub Pages
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
