# La démo en ligne : la maison de démonstration, servie par GitHub Pages.
#
# Une construction à part (`npm run build:demo`, mode Vite « demo ») qui
# démarre toujours dans la démo : il n'y a pas de Home Assistant derrière,
# aucune adresse à saisir. Elle suit `main` — chaque changement du dashboard
# s'y voit — et ne touche jamais au paquet que HACS livre (`dist-demo/`,
# pas `dist/`).
name: Démo en ligne

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois ; celle qui a commencé va au bout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire la démo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  publier:
    name: Publier sur GitHub Pages
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
