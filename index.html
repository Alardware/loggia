<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Loggia</title>
  <!-- Le thème AVANT la première peinture (audit du 27/09).

       Dans `index.css`, le sombre est `:root` et le clair `html.loggia-light` ;
       `html` prend `var(--o-bg)`. La classe n'arrivait qu'avec React, donc tout
       écran réglé en clair s'allumait SOMBRE une fraction de seconde à chaque
       chargement — visible sur une tablette murale, plusieurs fois par jour.

       Les mêmes clés et les mêmes défauts qu'`App.jsx` (`loggia-mode` au
       montage, `modeEff` pour « auto »), à une règle près : on ne pose la
       classe QUE si l'on est sûr. « Suivre Home Assistant » (`loggia-ha` à
       `FOLLOW`) ne se tranche qu'une fois HA joignable — on s'abstient, et
       l'écran se comporte comme avant. Se tromper coûterait plus cher que
       s'abstenir : un éclair CLAIR sur un écran sombre, la nuit. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('loggia-ha') === 'FOLLOW') return;
        var m = localStorage.getItem('loggia-mode');
        if (m !== 'light' && m !== 'dark' && m !== 'auto') m = 'dark';
        var clair = m === 'light'
          || (m === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (clair) document.documentElement.classList.add('loggia-light');
      } catch (e) { /* stockage refusé : on garde le sombre, comme avant */ }
    })();
  </script>
  <!-- Polices auto-hébergées (public/fonts) : dashboard fonctionnel sans internet.
       La variante PLEINE des icones (uicons-solid) n'est pas chargee : toutes les
       classes de Loggia sont baties en `fi fi-rr-` (icones.jsx, ui.jsx,
       Onboarding.jsx), aucune en `fi-sr-`. Elle coutait 151 Ko de CSS et 188 Ko
       de police, en feuille BLOQUANTE, pour rien (23/09). -->
  <link rel="stylesheet" href="./fonts/fonts.css" />
  <link rel="stylesheet" href="./fonts/uicons-regular-rounded.css" />
  <!-- Les deux polices de l'écran partent AVEC la page (lot 14 de l'audit du
       03/10). Une police n'est demandée qu'au premier glyphe qui l'emploie,
       donc après le premier rendu de React : celle des icônes (225 Ko,
       `font-display: block` — rien plutôt qu'un carré vide) arrivait des
       secondes après l'écran. Démo à froid, Slow 4G, en anglais, paquet servi
       sans compression comme par Home Assistant : icônes visibles à 15,7 s, à
       11,5 s avec ces deux lignes et le préchargement du boot
       (vite.config.js), l'écran entier d'un coup. Sur un lien lent elles
       partagent la bande avec le boot : sans elles, l'Accueil se dessine plus
       tôt (10,4 s) mais SANS icônes jusqu'à 14,1 s. Mêmes adresses que dans
       les deux feuilles ; `crossorigin` parce qu'une police se charge
       toujours en CORS, et qu'un préchargement sans lui serait téléchargé une
       seconde fois. Manrope : le seul fichier « latin », qui porte toutes les
       graisses ; le latin étendu et Newsreader partent quand un glyphe les
       demande. -->
  <link rel="preload" href="./fonts/uicons-regular-rounded.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/xn7gYHE41ni1AdIRggexSg.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
